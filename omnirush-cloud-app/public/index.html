<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><meta name="description" content="Your private OmniRush cloud coding workspace"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"><title>OmniRush Cloud</title><link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;--bg:#0d0e11;--panel:#14161b;--panel2:#1a1c22;--line:#292c34;--text:#f1f2f4;--muted:#9297a3;--accent:#c7f36b;--red:#f27b7b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:10px 14px}button:hover{border-color:#626775}button.primary{background:var(--accent);color:#11140b;border-color:var(--accent);font-weight:700}button.ghost{background:transparent}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{background:#101115;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;width:100%;outline:none}input:focus,textarea:focus,select:focus{border-color:#8eab51}#app{min-height:100dvh}.center{min-height:100dvh;display:grid;place-items:center;padding:20px}.login{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:-.4px}.logo{width:36px;height:36px;border-radius:12px;background:var(--accent);color:#10130a;display:grid;place-items:center;font-weight:900}.muted{color:var(--muted)}.small{font-size:12px}.stack{display:grid;gap:14px}.hidden{display:none!important}.layout{height:100dvh;display:grid;grid-template-columns:270px minmax(0,1fr);overflow:hidden}.sidebar{background:#111216;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.side-actions{display:flex;gap:8px;padding:12px}.chatlist{padding:4px 8px;overflow:auto;flex:1}.chatitem{width:100%;display:block;text-align:left;background:transparent;border-color:transparent;margin:3px 0;padding:10px 12px}.chatitem.active{background:#22252c;border-color:#30343e}.chatitem strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.chatitem span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidefoot{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}.main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 60% -10%,#20251c 0%,transparent 36%),var(--bg)}.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}.top-title{min-width:0}.top-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-title span{font-size:11px;color:var(--muted)}.messages{flex:1;overflow:auto;padding:24px max(18px,calc((100% - 850px)/2));scroll-behavior:smooth}.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:24px}.welcome h1{font-size:clamp(28px,5vw,44px);line-height:1.08;letter-spacing:-1.7px;margin:8px 0}.welcome p{color:var(--muted);max-width:470px;margin:0}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}.suggestions button{font-size:12px}.message{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;margin:0 auto 24px;max-width:850px}.avatar{width:28px;height:28px;border-radius:9px;background:#272b32;display:grid;place-items:center;font-size:11px;font-weight:800}.message.user .avatar{background:var(--accent);color:#12150b}.body{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:2px}.body pre{white-space:pre-wrap;background:#090a0c;border:1px solid var(--line);padding:12px;border-radius:12px;overflow:auto}.composer-wrap{padding:12px 16px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%)}.composer{max-width:850px;margin:auto;background:#15171c;border:1px solid #333640;border-radius:18px;padding:10px;box-shadow:0 10px 40px #0005}.composer textarea{border:0;background:transparent;resize:none;min-height:50px;max-height:160px;padding:8px;display:block}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 0}.repo-pill{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.setup{width:min(100%,1000px);background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}.setup-head{padding:20px 22px;border-bottom:1px solid var(--line)}.setup-body{padding:20px;display:grid;gap:16px}.term{height:300px;background:#090a0c;border:1px solid var(--line);border-radius:14px;padding:8px;overflow:hidden}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.step{border:1px solid var(--line);border-radius:14px;padding:13px}.step b{display:block;margin-bottom:5px}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--accent)}.status.bad{color:var(--red)}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px}.file-panel{position:absolute;right:14px;top:72px;bottom:100px;width:min(360px,calc(100vw - 28px));background:#15171c;border:1px solid var(--line);border-radius:16px;z-index:4;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 50px #0008}.file-list{overflow:auto;padding:8px}.file-row{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px;font-size:12px}.file-row:hover{background:#272a31}.file-content{flex:1;overflow:auto;padding:12px;white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace}.mobile-menu{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#272a31;border:1px solid #424650;padding:10px 15px;border-radius:12px;z-index:20;max-width:90vw;font-size:13px}.loading{opacity:.7;pointer-events:none}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;z-index:8;inset:0 auto 0 0;width:min(84vw,310px);transform:translateX(-105%);transition:transform .2s ease;box-shadow:20px 0 50px #0006}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.topbar{padding:0 12px;height:58px}.messages{padding:18px 14px}.composer-wrap{padding:8px 10px max(10px,env(safe-area-inset-bottom))}.steps{grid-template-columns:1fr}.term{height:260px}.setup-body{padding:14px}.setup-head{padding:16px}.welcome h1{font-size:34px}.repo-pill{max-width:55vw}.sidehead{padding:16px}.file-panel{bottom:90px}}
</style></head><body><div id="app"></div><div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script><script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const $=s=>document.querySelector(s);let chats=[],activeId=null,activeChat=null,term=null,termWs=null,filesOpen=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error+(d.detail?' — '+d.detail:'' )||'Request failed');return d}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3200)}
function showLogin(){ $('#app').innerHTML=`<div class="center"><form class="login stack" id="login"><div class="brand"><div class="logo">O</div> OmniRush <span class="muted">Cloud</span></div><div><h2 style="margin-bottom:5px">Your cloud workspace.</h2><div class="muted">Private access. Your code stays in the cloud workspace.</div></div><label class="stack" style="gap:7px"><span class="small muted">Workspace password</span><input type="password" id="password" placeholder="Enter your app password" autocomplete="current-password" required></label><button class="primary" type="submit">Open workspace</button><p class="small muted">This password is configured by the workspace owner in the server's .env file.</p></form></div>`;$('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});await boot()}catch(err){toast(err.message)}}}
async function boot(){try{const s=await api('/api/status');if(!s.omni.ok||!s.github.ok){showSetup(s);return}await loadChats();showWorkspace()}catch(e){if(e.message.includes('401'))showLogin();else showLogin()}}
function showSetup(status){$('#app').innerHTML=`<div class="center"><section class="setup"><header class="setup-head"><div class="brand"><div class="logo">O</div> OmniRush Cloud <span class="muted">/ first-time setup</span></div><p class="muted" style="margin-bottom:0">Sign in once on this cloud machine. Credentials stay in the cloud workspace; this app does not need phone storage.</p></header><div class="setup-body"><div class="steps"><div class="step"><b>1 · Connect GitHub</b><div id="gh-status" class="status ${status.github.ok?'ok':'bad'}">${status.github.ok?'Connected':'Not connected'}</div><p class="small muted">Run the command in the terminal below, then approve the device code in your browser.</p><button data-cmd="gh auth login --web">Run GitHub login</button></div><div class="step"><b>2 · Connect OmniRush</b><div id="or-status" class="status ${status.omni.ok?'ok':'bad'}">${status.omni.ok?'Connected':'Not connected'}</div><p class="small muted">Run once. If it prints a link or code, open the link and approve it.</p><button data-cmd="omnirush login">Run OmniRush login</button></div></div><div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>Cloud terminal</b><span class="small muted">Codespace shell</span></div><div class="term" id="term"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="check-status">Check connections</button><button id="refresh-term" class="ghost">Reconnect terminal</button><button id="continue" class="primary" ${status.github.ok&&status.omni.ok?'':'disabled'}>Open chats</button></div><p class="small muted">If the login command prints a URL, open it in a new browser tab and return here. Do not paste access tokens into chat.</p></div></section></div>`;connectTerminal();document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{if(termWs?.readyState===1){termWs.send(JSON.stringify({type:'input',data:b.dataset.cmd+'\r'}));term.focus()}else toast('Reconnect terminal first')});$('#refresh-term').onclick=()=>connectTerminal();$('#check-status').onclick=async()=>{try{const s=await api('/api/status');$('#gh-status').textContent=s.github.ok?'Connected':'Not connected';$('#gh-status').className='status '+(s.github.ok?'ok':'bad');$('#or-status').textContent=s.omni.ok?'Connected':'Not connected';$('#or-status').className='status '+(s.omni.ok?'ok':'bad');$('#continue').disabled=!(s.github.ok&&s.omni.ok);if(s.github.ok&&s.omni.ok)toast('Both services connected. Open chats when ready.')}catch(e){toast(e.message)}};$('#continue').onclick=async()=>{const s=await api('/api/status');if(s.github.ok&&s.omni.ok){await loadChats();showWorkspace()}else toast('Connect both GitHub and OmniRush first.')};}
async function connectTerminal(){const el=$('#term');if(!el)return;if(termWs)try{termWs.close()}catch{};if(term)try{term.dispose()}catch{};el.innerHTML='';if(!window.Terminal){el.innerHTML='<p class="muted">Terminal library could not load. Check internet access and refresh.</p>';return}term=new Terminal({cursorBlink:true,fontSize:12,fontFamily:'ui-monospace, SFMono-Regular, Menlo, monospace',theme:{background:'#090a0c',foreground:'#e9e9ed',cursor:'#c7f36b',green:'#c7f36b'},convertEol:true});const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(el);fit.fit();term.writeln('OmniRush Cloud terminal');term.writeln('Try: gh auth login --web   then   omnirush login');try{const {token}=await api('/api/terminal-token');const proto=location.protocol==='https:'?'wss:':'ws:';termWs=new WebSocket(`${proto}//${location.host}/terminal?token=${token}`);termWs.onopen=()=>{fit.fit();termWs.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}));term.focus()};termWs.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='data')term.write(m.data);else if(m.type==='error')term.writeln('\r\n'+m.data)};termWs.onclose=()=>term.writeln('\r\n[terminal disconnected — reconnect to continue]');term.onData(data=>{if(termWs?.readyState===1)termWs.send(JSON.stringify({type:'input',data}))});term.onResize(({cols,rows})=>{if(termWs?.readyState===1)termWs.send(JSON.stringify({type:'resize',cols,rows}))});window.addEventListener('resize',()=>{try{fit.fit()}catch{}})}catch(e){term.writeln('Could not connect: '+e.message)}}
async function loadChats(){chats=await api('/api/chats')}
function showWorkspace(){activeChat=null;$('#app').innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar"><div class="sidehead"><div class="brand"><div class="logo">O</div> OmniRush</div><button id="close-side" class="ghost mobile-menu">×</button></div><div class="side-actions"><button id="new-chat" class="primary" style="flex:1">＋ New chat</button><button id="setup-open" title="Connections">⚙</button></div><div class="chatlist" id="chatlist"></div><div class="sidefoot"><div><b style="font-size:12px">Cloud workspace</b><div class="small muted">GitHub connected</div></div><button id="logout" class="ghost">Exit</button></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button id="open-side" class="mobile-menu ghost">☰</button><div class="top-title"><strong id="active-title">New chat</strong><span id="active-repo">Choose a repository to begin</span></div></div><div style="display:flex;gap:6px"><button id="files-toggle">Files</button><button id="push">Push</button></div></header><div class="messages" id="messages"><div class="welcome"><div class="logo" style="width:52px;height:52px;font-size:20px">O</div><h1>What are we building?</h1><p>Describe what you want. OmniRush works in your selected cloud repository, and each chat stays linked to that repo.</p><div class="suggestions"><button data-suggest="Build a polished responsive landing page in this repository">Build a landing page</button><button data-suggest="Inspect this repository, explain its architecture, and identify the most important improvements">Understand this codebase</button><button data-suggest="Find bugs in this project, fix them, and run the relevant tests">Find and fix bugs</button></div><button id="choose-repo" class="primary" style="margin-top:12px">Choose repository</button></div></div><div class="composer-wrap"><form id="composer" class="composer"><textarea id="prompt" rows="1" placeholder="Message OmniRush…" disabled></textarea><div class="composer-bottom"><span id="repo-pill" class="repo-pill">No repository selected</span><button class="primary" id="send" type="submit" disabled>Send ↑</button></div></form></div></main><div id="file-panel" class="file-panel hidden"></div></div>`;renderChatList();$('#new-chat').onclick=openRepoModal;$('#choose-repo').onclick=openRepoModal;$('#close-side').onclick=()=>$('#sidebar').classList.remove('open');$('#open-side').onclick=()=>$('#sidebar').classList.add('open');$('#setup-open').onclick=async()=>showSetup(await api('/api/status'));$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});showLogin()};$('#files-toggle').onclick=toggleFiles;$('#push').onclick=pushChanges;$('#composer').onsubmit=sendMessage;$('#prompt').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px';$('#send').disabled=!e.target.value.trim()||!activeId});document.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>{if(!activeId)openRepoModal();else{$('#prompt').value=b.dataset.suggest;$('#prompt').dispatchEvent(new Event('input'));$('#prompt').focus()}});if(chats.length)openChat(chats[0].id)}
function renderChatList(){const el=$('#chatlist');if(!el)return;el.innerHTML=chats.map(c=>`<button class="chatitem ${c.id===activeId?'active':''}" data-chat="${esc(c.id)}"><strong>${esc(c.title)}</strong><span>${esc(c.repo)}</span></button>`).join('')||'<p class="small muted" style="padding:12px">Your chats will appear here.</p>';el.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{openChat(b.dataset.chat);$('#sidebar').classList.remove('open')})}
async function openChat(id){activeId=id;try{const d=await api('/api/chats/'+id);activeChat=d;$('#active-title').textContent=d.chat.title;$('#active-repo').textContent=d.chat.repo;$('#repo-pill').textContent=d.chat.repo;$('#prompt').disabled=false;$('#send').disabled=false;renderMessages(d.messages);renderChatList()}catch(e){toast(e.message)}}
function renderMessages(messages){const el=$('#messages');if(!messages.length){el.innerHTML=`<div class="welcome"><div class="logo" style="width:52px;height:52px;font-size:20px">O</div><h1>Let's build.</h1><p>Tell OmniRush what to change in ${esc(activeChat?.chat?.repo||'this repository')}.</p></div>`;return}el.innerHTML=messages.map(m=>`<article class="message ${m.role==='user'?'user':''}"><div class="avatar">${m.role==='user'?'YOU':'O'}</div><div class="body">${esc(m.content)}</div></article>`).join('');el.scrollTop=el.scrollHeight}
async function openRepoModal(){try{const repos=await api('/api/repos');$('#overlay').innerHTML=`<div class="modalback"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Start a chat</h3><button id="modal-close" class="ghost">×</button></div><p class="small muted" style="margin:0">Each chat is attached to one repository. Choose an existing repo or create a new private repo automatically.</p><label class="stack" style="gap:7px"><span class="small muted">Existing repository</span><select id="repo-select"><option value="">Choose repository…</option>${repos.map(r=>`<option value="${esc(r.nameWithOwner)}">${esc(r.nameWithOwner)}${r.isPrivate?' · private':''}</option>`).join('')}</select></label><button id="open-existing" class="primary">Open selected repository</button><div style="height:1px;background:var(--line)"></div><label class="stack" style="gap:7px"><span class="small muted">Or create a new private GitHub repository</span><input id="new-repo-name" placeholder="my-new-project" maxlength="80"></label><button id="create-repo">Create private repo & start chat</button><div id="modal-error" class="small" style="color:var(--red)"></div></div></div>`;$('#modal-close').onclick=()=>$('#overlay').innerHTML='';$('#open-existing').onclick=()=>createChat({repo:$('#repo-select').value});$('#create-repo').onclick=()=>createChat({createName:$('#new-repo-name').value.trim()});}catch(e){toast(e.message);if(e.message.includes('Connect GitHub'))showSetup(await api('/api/status'))}}
async function createChat(body){const err=$('#modal-error');try{if(!body.repo&&!body.createName)throw Error('Choose a repository or enter a new name.');$('#overlay').querySelectorAll('button').forEach(b=>b.disabled=true);const d=await api('/api/chats',{method:'POST',body:JSON.stringify(body)});$('#overlay').innerHTML='';await loadChats();if(!chats.some(c=>c.id===d.id)){await loadChats()}if($('#app .layout')){activeId=d.id;renderChatList();await openChat(d.id)}else showWorkspace();toast('Cloud workspace ready for '+d.repo)}catch(e){if(err)err.textContent=e.message;$('#overlay').querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function sendMessage(e){e.preventDefault();if(!activeId)return;const input=$('#prompt'),message=input.value.trim();if(!message)return;input.value='';input.style.height='auto';$('#send').disabled=true;const current=activeChat.messages||[];current.push({role:'user',content:message});renderMessages(current);const el=$('#messages');el.insertAdjacentHTML('beforeend','<article class="message"><div class="avatar">O</div><div class="body muted" id="thinking">OmniRush is working in your cloud repo…</div></article>');el.scrollTop=el.scrollHeight;document.body.classList.add('loading');try{const d=await api(`/api/chats/${activeId}/message`,{method:'POST',body:JSON.stringify({message})});await openChat(activeId);toast('Turn complete')}catch(err){toast(err.message);await openChat(activeId)}finally{document.body.classList.remove('loading');$('#send').disabled=false;$('#prompt').focus()}}
async function toggleFiles(){filesOpen=!filesOpen;const panel=$('#file-panel');if(!filesOpen){panel.classList.add('hidden');return}panel.classList.remove('hidden');panel.innerHTML='<div style="padding:14px;border-bottom:1px solid var(--line)"><b>Repository files</b><button id="files-close" style="float:right">×</button></div><div class="file-list muted small">Loading…</div><pre class="file-content hidden"></pre>';$('#files-close').onclick=()=>{filesOpen=false;panel.classList.add('hidden')};if(!activeId){panel.querySelector('.file-list').textContent='Choose a repository first.';return}try{const files=await api('/api/files/'+activeId);const list=panel.querySelector('.file-list');list.innerHTML=files.map(f=>`<button class="file-row" data-path="${esc(f.path)}">${f.type==='dir'?'▸':'·'} ${esc(f.path)} ${f.type==='file'?`<span class="muted">${f.size} B</span>`:''}</button>`).join('')||'No files yet';list.querySelectorAll('[data-path]').forEach(b=>b.onclick=async()=>{if(files.find(f=>f.path===b.dataset.path)?.type==='dir')return;try{const d=await api('/api/file/'+activeId+'?path='+encodeURIComponent(b.dataset.path));const pre=panel.querySelector('.file-content');pre.textContent=d.content;pre.classList.remove('hidden')}catch(e){toast(e.message)}})}catch(e){panel.querySelector('.file-list').textContent=e.message}}
async function pushChanges(){if(!activeId){toast('Start a chat first');return}if(!confirm('Commit and push all workspace changes to the linked GitHub repository?'))return;try{const d=await api('/api/chats/'+activeId+'/push',{method:'POST',body:JSON.stringify({message:'Update from OmniRush Cloud'})});toast(d.message)}catch(e){toast(e.message)}}
(async()=>{try{await api('/api/status');await boot()}catch{showLogin()}})();
</script></body></html>
